<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title and Favicon  -->
    <title>English Janala | Best platform for leaning English</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- TailwindCss and DaisyUi  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Fonts Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- Style sheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header section -->
    <header>
        <div class="navbar bg-base-100 shadow-sm bg-[#BADEFF]/26">
            <div class="navbar-start">
                <a href="" class="flex items-center gap-1">
                    <span class="text-lg font-bold">English</span>
                    <img src="assets/logo.png" alt="">
                    <span class="font-bangla font-semibold text-lg">জানালা</span>
                </a>
            </div>
            <div class="navbar-end">
                <!-- Desktop links (hidden on small screens) -->
                <ul class="menu menu-horizontal px-1 space-x-4 hidden lg:flex">
                    <li>
                        <a href="" class="btn btn-outline btn-primary"><i class="fa-solid fa-circle-question"></i>
                            FAQ</a>
                    </li>
                    <li>
                        <a href="" class="btn btn-outline btn-primary"> <i class="fa-solid fa-book-open"></i> Learn</a>
                    </li>
                    <li>
                        <a href="" class="btn btn-outline btn-primary"> <i
                                class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
                    </li>
                </ul>
                <!-- Hamburger menu (visible only on small screens) -->
                <div class="dropdown dropdown-end lg:hidden">
                    <div tabindex="0" role="button" class="btn btn-ghost">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h8m-8 6h16" />
                        </svg>
                    </div>
                    <ul tabindex="-1"
                        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow space-y-4">
                        <li>
                            <a href="" class=""><i class="fa-solid fa-circle-question"></i>
                                FAQ</a>
                        </li>
                        <li>
                            <a href="" class=""> <i class="fa-solid fa-book-open"></i>
                                Learn</a>
                        </li>
                        <li>
                            <a href="" class=""> <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <!-- Banner section -->
    <section class="flex flex-col-reverse md:flex-row gap-5 justify-between items-center py-5 w-11/12 mx-auto ">
        <div class="content flex-1 space-y-5 text-left">
            <h2 class="font-bold text-[48px] mb-5"><span class="text-[#00bcff]">
                English</span> is Easy!!
            </h2>
            <p class="font-bangla text-[#18181b] font-medium text-[20px]">
                আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন।
                আপনি যদি নতুন হন অথবা <br> আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে <br> যাবে
                অন্য একটি Level এ
            </p>
            <div class="form flex flex-col gap-4">
                <input type="email" class="input border border-[#181b1b]/20 focus: outline-none" placeholder="Enter Your Name" />
                <input type="password" class="input  border border-[#181b1b]/20 focus: outline-none" placeholder="Password" />
            </div>
            <button class="btn btn-primary">Get Started</button>
        </div>
        <div class="image flex-1">
            <img src="assets/hero-student.png" alt="">
        </div>
    </section>
    <!-- Main section -->
    <section class="main-section w-11/12 mx-auto text-center">
        <h2 class="font-bold text-[36px] mb-8"><span class="text-[#00bcff]">Let's</span> Learn Vocabularies</h2>
        <div id="level-container" class="flex gap-5 flex-wrap justify-center mb-6">
        </div>
    </section>
    <script src="script/index.js"></script>
</body>

</html>
